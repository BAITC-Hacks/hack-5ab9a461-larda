name: hackalem-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackalem_test
      POSTGRES_USER: hackalem
      POSTGRES_PASSWORD: hackalem
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackalem -d hackalem_test"]
      interval: 2s
      timeout: 2s
      retries: 20
